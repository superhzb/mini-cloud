# mini-cloud infra stack — Postgres, MinIO, Loki, Prometheus, Grafana.
#
# The SAME file runs on the Mac mini and on a Linux VPS (the cloud-graduation story).
# Data lives in Docker NAMED VOLUMES, never in the repo tree.
#
#   cp .env.example .env   # loopback-only defaults are safe as-is
#   docker compose up -d   # or: make up
#
# Binding: every published port is prefixed with ${INFRA_BIND_ADDR:-127.0.0.1}. Loopback by
# default. Moving INFRA_BIND_ADDR off loopback widens the trust boundary — Postgres already runs
# scram-sha-256 here; set real MinIO keys and a strong Postgres password in .env first
# (see docs/MINI_CLOUD_ARCHITECTURE.md → Multi-machine development).

name: mini-cloud-infra

services:
  postgres:
    # PostgreSQL 16 with the pgvector extension files installed. create-project.sh enables the
    # extension in each app database (including databases created before this image switch).
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # scram-sha-256 always — hard prerequisite for any non-loopback bind, harmless on loopback.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      # Host port is a rare high port, not the well-known 5432 (avoids clashing with a dev's own
      # local Postgres). Container still listens on 5432. Registry: docs/env-and-ports.md.
      - "${INFRA_BIND_ADDR:-127.0.0.1}:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:19000:9000"   # S3 API (rare host port; container is 9000)
      - "${INFRA_BIND_ADDR:-127.0.0.1}:19001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:13100:3100"   # rare host port; container is 3100
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:19090:9090"   # rare host port; container is 9090
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Loopback single-user dev default. Turn off only behind real auth on a non-loopback bind.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:13000:3000"   # rare host port; container is 3000
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Adminer — lightweight Postgres data browser (view tables/fields, inline-edit, delete rows,
  # run SQL). One login to the `postgres` server → pick ANY project database from the dropdown.
  # DEV / LOOPBACK ONLY: this exposes the Postgres SUPERUSER across every project DB. It must be
  # removed or put behind real auth before any non-loopback bind or VPS graduation (stricter than
  # the MinIO console — it can mutate data). No volume, no extra credentials; reuses POSTGRES_*.
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # DEV auto-login: the mounted plugin below reads these to log you straight in (loopback only).
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: ${POSTGRES_USER:-postgres}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ADMINER_DEFAULT_DB: ${ADMINER_DEFAULT_DB:-}   # optional: land directly in this DB
      ADMINER_DESIGN: dracula
    volumes:
      # Auto-login plugin — DEV/LOOPBACK ONLY. Remove this mount for any non-loopback bind.
      - ./config/adminer/plugins-enabled:/var/www/html/plugins-enabled:ro
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:18432:8080"   # rare port, loopback-only ("admin for 5432")
    healthcheck:   # adminer image has php but no wget/curl — probe its own socket via php
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"localhost\",8080)?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
  loki-data:
  prometheus-data:
  grafana-data:
