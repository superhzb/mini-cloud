[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mini-cloud-identity"
description = "The mini-cloud identity service: Google OAuth login → short-lived, asymmetrically-signed platform JWT, plus a JWKS trust anchor and a per-app grants store. The login authority the `mini-cloud-auth` SDK verifies against."
readme = "README.md"
authors = [{ name = "Brett Huang" }]
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "mini-cloud-config>=0.1.0",
  "mini-cloud-db>=0.1.0",
  "mini-cloud-auth[fastapi]>=0.1.0",
  "mini-cloud-obs[asgi]>=0.1.0",
  "pyjwt[crypto]>=2.8.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pyright>=1.1.400", "ruff>=0.11.0", "httpx>=0.27.0"]

[project.scripts]
mini-cloud-identity = "mini_cloud_identity.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_cloud_identity"]

[tool.hatch.build.targets.wheel.force-include]
"src/mini_cloud_identity/migrations" = "mini_cloud_identity/migrations"

[tool.ruff]
extend = "../../tooling/ruff-base.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "live: hits real Google OAuth or a real Postgres/JWKS; run with --run-live and real creds",
]
pythonpath = ["src"]
testpaths = ["tests"]
