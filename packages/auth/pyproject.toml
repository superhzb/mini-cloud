[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mini-cloud-auth"
description = "Thin platform identity for mini-cloud apps: verify a Google-backed platform JWT (asymmetric, JWKS) and enforce per-app authorization grants — a plug-and-play FastAPI dependency."
readme = "README.md"
authors = [{ name = "Brett Huang" }]
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "mini-cloud-config>=0.1.0",
  "pyjwt[crypto]>=2.8.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# The FastAPI dependency (`require_user`) needs FastAPI; the core verifier does not, so it's an
# extra — exactly how obs keeps starlette in [asgi]. A non-FastAPI verifier (a worker, a script)
# installs the bare package and calls `verify_token` directly.
fastapi = ["fastapi>=0.115.0"]

[dependency-groups]
dev = ["pytest>=8.3.0", "pyright>=1.1.400", "ruff>=0.11.0", "fastapi>=0.115.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_cloud"]

[tool.ruff]
extend = "../../tooling/ruff-base.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "live: hits the real identity service JWKS; run with MINI_AUTH_ISSUER and --run-live",
]
pythonpath = ["src"]
testpaths = ["tests"]
