[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mini-cloud-obs"
description = "Structured logging (Loki), Prometheus metrics, and correlation-ID propagation for mini-cloud apps."
readme = "README.md"
authors = [{ name = "Brett Huang" }]
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "mini-cloud-config>=0.1.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# The ASGI middleware needs starlette; core logging/metrics do not, so it's an extra.
asgi = ["starlette>=0.37.0"]

[dependency-groups]
dev = ["pytest>=8.3.0", "pyright>=1.1.400", "ruff>=0.11.0", "starlette>=0.37.0", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_cloud"]

[tool.ruff]
extend = "../../tooling/ruff-base.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]
