[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ref-fastapi"
description = "In-repo reference FastAPI app — the SDK proof, the fastapi template seed, and the 7/7 scorecard regression guard."
readme = "README.md"
authors = [{ name = "Brett Huang" }]
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "mini-cloud-config>=0.1.0",
  "mini-cloud-db>=0.1.0",
  "mini-cloud-storage>=0.1.0",
  "mini-cloud-obs[asgi]>=0.1.0",
  "mini-cloud-inference>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pyright>=1.1.400", "ruff>=0.11.0", "httpx>=0.27.0"]

[project.scripts]
ref-fastapi = "ref_fastapi.__main__:main"
ref-fastapi-worker = "ref_fastapi.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ref_fastapi"]

[tool.ruff]
extend = "../../tooling/ruff-base.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "live: hits the real infra stack (Postgres + MinIO); run with --run-live and canonical env",
]
pythonpath = ["src"]
testpaths = ["tests"]
