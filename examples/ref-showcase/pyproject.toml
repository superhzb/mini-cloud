[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ref-showcase"
description = "In-repo 'kitchen sink' reference — a Document Intelligence service that exercises every public SDK surface, and the coverage/regression canary for the SDK."
readme = "README.md"
authors = [{ name = "Brett Huang" }]
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "mini-cloud-config>=0.1.0",
  "mini-cloud-db>=0.1.0",
  "mini-cloud-storage>=0.1.0",
  "mini-cloud-obs[asgi]>=0.1.0",
  "mini-cloud-inference>=0.1.0",
  "mini-cloud-analytics>=0.1.0",
  "prometheus-client>=0.20.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pyright>=1.1.400", "ruff>=0.11.0", "httpx>=0.27.0"]

[project.scripts]
ref-showcase = "ref_showcase.__main__:main"
ref-showcase-worker = "ref_showcase.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ref_showcase"]

[tool.ruff]
extend = "../../tooling/ruff-base.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "live: hits the real infra stack (Postgres + MinIO); run with --run-live and canonical env",
]
pythonpath = ["src"]
testpaths = ["tests"]
